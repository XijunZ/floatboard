name = "floatboard"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The skills (src/skills/*.md) and the phone app's scripts (src/phone/files/*.client.js) are bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.client.js"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "floatboard"
database_id = "00000000-0000-0000-0000-000000000000" # set by `wrangler d1 create floatboard`
migrations_dir = "migrations"

[triggers]
# One schedule, every 5 minutes: reading, due reminders and Watch replies (src/index.ts decides which jobs each run does).
crons = ["*/5 * * * *"]

[observability]
enabled = true
