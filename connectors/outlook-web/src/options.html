<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FloatBoard for Outlook</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 28px; }
  button { font: inherit; padding: 6px 14px; }
  .hint { color: #6e6e73; font-size: 13px; }
  .status { margin-left: 8px; }
</style>
</head>
<body>
<h1>FloatBoard for Outlook</h1>

<h2>Page sample</h2>
<p class="hint">Saves a copy of the open Outlook page with every name, address, id and message text replaced by
placeholders, so the page layout can be checked without sharing your email.</p>
<button id="sample" type="button">Save page sample</button><span id="sampleStatus" class="status"></span>

<script src="options.js"></script>
</body>
</html>
